<html>
    <head>
        <title>Q9</title>
        <style>
            table{
                margin-left: 40%;
            }
            .input{
                text-align: left ;
                width: 270px;
            }
            td{
                width: 50px;
            }
        </style>
    </head>
    <body>
        <table style="text-align: right;" border="1" style="width: 500px;">
            <tr>
                <td width="200px">
                    Last Name 
                </td>
                <td class="input"><input type="text" placeholder="Last name"></td>
            </tr>
            <tr>
                <td>
                    First Name 
                </td>
                <td class="input"><input type="text" placeholder="First name"></td>
            </tr>
            <tr>
                <td>
                    Address
                </td>
                <td class="input"><textarea row =3 col="10"></textarea></td>
            </tr>
            <tr>
                <td>
                   City
                </td>
                <td class="input"><input type="text" placeholder="City"> state <input style="width: 50px;" type="text" placeholder="state"></td>
            </tr>
            <tr>
                <td>Zip Code </td>
                <td class="input"><input type="text" placeholder="Zip Code"></td>
            </tr>
            <tr>
                <td>Country </td>
                <td class="input"><select name="" id="">
                    <option value="">India</option>
                    <option value="">Japan</option>
                    <option value="">Russia</option>
                    <option value="">London</option>
                </select></td>
            </tr>
            <tr>
                <td>Phone(County code,area code,number) </td>
                <td class="input">(<input type="tel" placeholder="+91-xxxxxxxxxx"></td>
            </tr>
            <tr>
                <td>Email </td>
                <td class="input"><input type="email" placeholder="Email"></td>
            </tr>
            <tr>
                <td> DOB </td>
                <td class="input"><input type="date" placeholder=""></td>
            </tr>
            <tr>
                <td> Gender </td>
                <td class="input"><select name="gender" id="">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

                </select></td>
            </tr>
            <tr>
                <td>Starting Date </td>
                <td class="input" colspan="3"><input type="radio" name="start">Spring 2006 <input type="radio" name="start" id="">Summber 2006</td>
            </tr>
            <tr>
                <td align="center" colspan="4">
                    <button type="submit">submit</button>
                    <button type="reset">Clear this form</button>
                </td>
            </tr>
        </table>
    </body>
</html>
