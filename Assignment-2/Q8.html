<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
        <title>
            Q8
        </title>

        <style>
            body{
                background-color: #2e3740;
            }
            h1{
                color: #6b7680;
                font-family: "Grand Hotel", cursive;
                font-weight: 500;
                font-style: normal;
                font-size: 50px;
                
                
            }
            .container{
                display: flex;
                justify-content: center;
                flex-direction: column;
                align-items: center;
                
                gap: 5px;
            }
            
            #btn{
                background-color: #1fce6e;
                height: 42px;
                color: white;
            }
            span{
                color:#6b7680;
            }
            input{
                width: 300px;
                border: none;
                background: transparent;
                border-bottom: 2px solid #6b7680;
                padding: 10px;
            }
                input[type="radio"] {
                width: auto;
                margin: 0;
                padding: 0;
                
            }

            .radio-group {
               
                display: flex; 
                align-items: center;
                gap: 12px; 
                white-space: nowrap; 
                color: #708499;
                cursor: not-allowed;
                width: 300px; 
                box-sizing: border-box;
                padding: 5px 0;
            }
           
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="title">Register</h1>
            <input type="text" name="Username" id="" placeholder="Username">
            <input type="password" name="password" id="" placeholder="Password">
            <input type="email" name="email" id="" placeholder="E-Mail Address">
            <label class="radio-group"><input type="radio" name="" id="terms"> <span>Accept terms and Conditions</span></input></label>
            <input type="button" value="Register" id="btn">
            <span>Already have an account</span>
        </div>
    </body>
